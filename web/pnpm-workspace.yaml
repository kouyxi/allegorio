# Não é monorepo: um pacote só, na raiz. `pnpm approve-builds` escreveu este
# arquivo só com `allowBuilds`, sem `packages`, e pnpm 10 recusa esse arquivo
# com "packages field missing or empty" antes de tentar instalar — é o mesmo
# bug corrigido em app/pnpm-workspace.yaml. https://github.com/pnpm/pnpm/issues/9361
packages:
  - .

allowBuilds:
  better-sqlite3: true
  esbuild: true
